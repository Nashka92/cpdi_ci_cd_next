name: Renovate Action

on:
  # Permet de lancer Renovate a la main depuis GitHub Actions.
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest

    # Donne a Renovate le droit de crreer des branches et des pull requests.
    permissions:
      contents: write
      pull-requests: write
      issues: write

    container:
      image: renovate/renovate:latest

    steps:
      - name: Run Renovate
        env:
          # Dit a Renovate qu'il travaille sur GitHub, dans ce depot.
          RENOVATE_PLATFORM: github
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN || github.token }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
        run: renovate

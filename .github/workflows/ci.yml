name: CI test

on:
  pull_request:
    branches:
      - develop

  push:
    branches:
      - develop

jobs:
  build_docker:
    runs-on: ubuntu-latest

    steps:
      - name: Install checkout
        uses: actions/checkout@v7

      - name: Check Docker version
        run: |
          docker -v
          docker compose version

      - name: install dependencies
        run: docker compose run --rm node npm ci

      - name: lint
        run: docker compose run --rm node npm run lint

      - name: build app
        run: docker compose run --rm node npm run build
